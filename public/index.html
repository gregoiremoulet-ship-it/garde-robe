<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee6"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>Ma Garde-robe</title>
<style>
:root{--bg:#f3eee6;--paper:#fbf8f3;--ink:#161514;--mut:#7d766c;--line:#16151422;--acc:#8a6a3f;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:env(safe-area-inset-top) 0 96px;-webkit-font-smoothing:antialiased}
.bg{display:none}
header{padding:26px 20px 14px;max-width:760px;margin:auto;text-align:center;border-bottom:1px solid var(--ink);position:relative}
header:after{content:"";position:absolute;left:20px;right:20px;bottom:3px;border-bottom:1px solid var(--ink)}
h1{font-family:var(--serif);font-weight:400;font-size:44px;margin:0;letter-spacing:10px;text-transform:uppercase;padding-left:10px;animation:fd .8s ease both}
h1 span{display:none}
#sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-top:6px}
main{max-width:760px;margin:auto;padding:8px 20px;animation:fu .5s ease both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
@keyframes fd{from{opacity:0;letter-spacing:22px}}
h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:34px;line-height:1.05;margin:26px 0 14px;letter-spacing:-.5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#f3eee6f2;backdrop-filter:blur(10px);border-top:1px solid var(--ink);z-index:5}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-family:var(--sans);position:relative;transition:color .3s}
nav button b{display:none}
nav button:after{content:"";position:absolute;left:50%;right:50%;bottom:2px;height:1px;background:var(--ink);transition:.35s}
nav .on{color:var(--ink)}nav .on:after{left:14px;right:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:0;padding:18px;margin-bottom:16px}
small,.mut{color:var(--mut);font-size:10px;letter-spacing:2.5px;text-transform:uppercase}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:0;padding:14px 20px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-family:var(--sans);transition:.25s;cursor:pointer}
.btn:hover{background:var(--acc);border-color:var(--acc)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.sm{padding:10px 14px;font-size:10px}.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:none;border:0;border-bottom:1px solid transparent;color:var(--mut);padding:6px 2px;margin-right:10px;font-family:var(--serif);font-style:italic;font-size:17px;transition:.25s;cursor:pointer}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
.grid>*{animation:fu .6s ease both}
.grid>*:nth-child(2){animation-delay:.05s}.grid>*:nth-child(3){animation-delay:.1s}.grid>*:nth-child(4){animation-delay:.15s}.grid>*:nth-child(5){animation-delay:.2s}.grid>*:nth-child(6){animation-delay:.25s}.grid>*:nth-child(n+7){animation-delay:.3s}
.it{position:relative;overflow:hidden;background:#e7e0d4;aspect-ratio:3/4;cursor:pointer;outline:1px solid transparent;outline-offset:3px;transition:outline-color .3s}
.it img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.it:hover img{transform:scale(1.07)}
.it.sel{outline-color:var(--ink)}
.it .ph{display:flex;height:100%;align-items:center;justify-content:center;font-size:34px;filter:grayscale(1);opacity:.5}
.it .lb{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-family:var(--serif);font-style:italic;font-size:13px;background:#fbf8f3eb;color:var(--ink);transform:translateY(0);transition:.3s}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid #0003;margin-right:6px;vertical-align:1px}
.render{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;animation:fu .8s ease both}
.shim{aspect-ratio:3/4;background:linear-gradient(100deg,#e7e0d4 30%,#f6f1e9 50%,#e7e0d4 70%);background-size:300% 100%;animation:sh 1.4s infinite;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--mut)}
@keyframes sh{to{background-position:-150% 0}}
.sheet{position:fixed;inset:0;background:#1615148c;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px;border-top:1px solid var(--ink);animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(80px);opacity:0}}
input,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);color:var(--ink);border-radius:0;padding:12px 2px;font-size:16px;margin:6px 0;font-family:var(--sans);outline:none}
input:focus,select:focus{border-bottom-color:var(--acc)}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid #0002;padding:0;cursor:pointer;transition:.2s}.sw.on{outline:1px solid var(--ink);outline-offset:3px}
.drop{border:1px solid var(--line);background:var(--paper);padding:24px;text-align:center;color:var(--mut);position:relative;overflow:hidden;font-family:var(--serif);font-style:italic}
.drop img{max-height:240px}.drop input{position:absolute;inset:0;opacity:0;margin:0}
.mini{display:flex;flex-direction:column;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.pc{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:16px}
.mini img,.mini .ph{width:52px;height:66px;object-fit:cover;background:#e7e0d4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:12px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:.4s cubic-bezier(.2,.8,.2,1);z-index:20}#toast.on{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-family:var(--serif);font-style:italic;font-size:18px}
</style></head><body>
<div class="bg"></div>
<header><h1>Maison<span>.</span></h1><div id="sub"></div></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="sheet" class="sheet"></div><div id="toast"></div>
<script>
const CATS=["T-shirt","Pull & sweat","Bas","Robe","Veste","Chaussures","Accessoire"],EMO={"T-shirt":"👕","Pull & sweat":"🧶",Haut:"👕",Bas:"👖",Robe:"👗",Veste:"🧥",Chaussures:"👟",Accessoire:"🧣"};
const SEAS=["Été","Hiver","Mi-saison"],OCC=["Décontracté","Travail","Soirée","Sport"];
const COL={Noir:"#111",Blanc:"#f5f5f5",Gris:"#999",Beige:"#d9c3a0",Marron:"#7a4a2a",Bleu:"#2a5db0",Marine:"#14284b",Vert:"#2f7d4f",Rouge:"#c0262d",Rose:"#e88ab0",Jaune:"#f2c230",Orange:"#e8782a",Violet:"#7a4fb0"};
const NEUTRAL=["Noir","Blanc","Gris","Beige","Marine","Marron"];
const $=s=>document.querySelector(s),m=$("#m"),sheet=$("#sheet");
const id=()=>Math.random().toString(36).slice(2,9),pick=a=>a[Math.floor(Math.random()*a.length)];
const DEF=[["T-shirt blanc épais","T-shirt","Blanc","U:465185/item/eugoods_00_465185_3x4.jpg"],["T-shirt blanc fin long","T-shirt","Blanc","U:465193/item/eugoods_00_465193_3x4.jpg"],["T-shirt blanc fin normal","T-shirt","Blanc","U:455365/item/eugoods_00_455365_3x4.jpg"],["T-shirt blanc près du corps","T-shirt","Blanc","U:455365/item/eugoods_00_455365_3x4.jpg"],["T-shirt blanc avec image","T-shirt","Blanc","U:455365/item/eugoods_00_455365_3x4.jpg"],["Polo blanc Ralph Lauren","T-shirt","Blanc","U:482325/item/eugoods_01_482325_3x4.jpg"],["T-shirt blanc Stüssy","T-shirt","Blanc","S:1905000_WHIT_1.jpg"],["Pull quart zip blanc Ralph Lauren","Pull & sweat","Blanc","L:img/quart-zip-blanc-rl.jpg"],["Pull rayé blanc et gris","Pull & sweat","Blanc","L:img/pull-raye-blanc-gris.jpg"],["Pull blanc","Pull & sweat","Blanc","L:img/pull-blanc.jpg"],["Pull torsadé blanc Ralph Lauren","Pull & sweat","Blanc","L:img/torsade-blanc-rl.jpg"],["Sweat zip blanc Ralph Lauren","Pull & sweat","Blanc","L:img/sweat-zip-blanc-rl.jpg"],["T-shirt noir près du corps","T-shirt","Noir","U:455365/item/eugoods_09_455365_3x4.jpg"],["T-shirt noir épais","T-shirt","Noir","U:465185/item/eugoods_09_465185_3x4.jpg"],["T-shirt noir normal","T-shirt","Noir","L:img/tshirt-noir.jpg"],["T-shirt noir Stüssy","T-shirt","Noir","S:1905000_BLAC_1.jpg"],["Pull noir","Pull & sweat","Noir","L:img/pull-noir.jpg"],["Pull col roulé noir","Pull & sweat","Noir","L:img/col-roule-noir.jpg"],["T-shirt bleu Carhartt","T-shirt","Bleu","L:img/tshirt-carhartt.jpg"],["T-shirt bordeaux","T-shirt","Rouge","L:img/tshirt-bordeaux.jpg"],["T-shirt marron","T-shirt","Marron","U:465185/item/eugoods_39_465185_3x4.jpg"],["Pull marron","Pull & sweat","Marron","L:img/pull-marron.jpg"],["Pull torsadé marron Ralph Lauren","Pull & sweat","Marron","L:img/torsade-marron-rl.jpg"],["T-shirt vert olive","T-shirt","Vert","L:img/tshirt-olive.jpg"],["Pull vert foncé torsadé","Pull & sweat","Vert","L:img/pull-vert-torsade.jpg"],["Pull vert et rose","Pull & sweat","Vert","L:img/pull-vert-rose.jpg"],["Pull vert très foncé","Pull & sweat","Vert","L:img/pull-vert-fonce.jpg"],["Pull quart zip vert Ralph Lauren","Pull & sweat","Vert","U:486078/item/eugoods_58_486078_3x4.jpg"],["T-shirt gris manches longues","T-shirt","Gris","L:img/tshirt-gris-ml.jpg"],["Henley gris","T-shirt","Gris","L:img/henley-gris.jpg"],["Sweat capuche gris foncé","Pull & sweat","Gris","L:img/sweat-gris-fonce.jpg"],["Sweat capuche gris Stüssy (1)","Pull & sweat","Gris","L:img/sweat-stussy-gris.jpg"],["Sweat capuche gris Stüssy (2)","Pull & sweat","Gris","S:1925000_ASHH_1.jpg"],["T-shirt bleu foncé près du corps","T-shirt","Marine","L:img/tshirt-marine.jpg"],["T-shirt bleu foncé logo Ralph Lauren","T-shirt","Marine","L:img/tshirt-marine-rl.jpg"],["Polo bleu foncé","T-shirt","Marine","U:482325/item/eugoods_69_482325_3x4.jpg"],["Pull quart zip bleu foncé","Pull & sweat","Marine","L:img/quart-zip-bleu.jpg"],["Pull col roulé bleu foncé","Pull & sweat","Marine","L:img/col-roule-bleu.jpg"],["Pull bleu foncé Stone","Pull & sweat","Marine","L:img/pull-stone.jpg"],["Pull quart zip marinière","Pull & sweat","Marine","L:img/quart-zip-mariniere.jpg"],["Jean bleu clair","Bas","Bleu","L:img/jean-bleu-clair.jpg"],["Jean bleu foncé","Bas","Marine","L:img/jean-brut.jpg"],["Jean gris","Bas","Gris","L:img/jean-gris.jpg"],["Jean noir","Bas","Noir","L:img/jean-noir.jpg"],["Pantalon noir","Bas","Noir","L:img/pantalon-noir.jpg"],["Jean blanc","Bas","Blanc","L:img/jean-blanc.jpg"],["Pantalon blanc","Bas","Blanc","L:img/pantalon-blanc.jpg"],["Pantalon beige","Bas","Beige","L:img/pantalon-beige.jpg"],["Veste noire","Veste","Noir","U:487326/item/eugoods_69_487326_3x4.jpg"],["K-way noir Stone","Veste","Noir","L:img/kway-noir-stone.jpg"],["Veste verte","Veste","Vert","L:img/veste-verte.jpg"],["Veste beige","Veste","Beige","L:img/veste-beige.jpg"],["Veste bleu foncé en laine","Veste","Marine","L:img/veste-bleu-laine.jpg"],["Pull gris","Pull & sweat","Gris","U:453754/item/eugoods_03_453754_3x4.jpg"],["Pull beige","Pull & sweat","Beige","U:453754/item/eugoods_31_453754_3x4.jpg"],["Pull quart zip noir","Pull & sweat","Noir","U:481731/item/eugoods_09_481731_3x4.jpg"],["Pantalon marron","Bas","Marron","U:484875/item/eugoods_34_484875_3x4.jpg"],["Veste en cuir","Veste","Marron","L:img/veste-cuir.jpg"]];
const DEFL=[["Veste bleue 1",["Veste bleu foncé en laine","Pull blanc","Jean bleu clair"]],["Veste bleue 2",["Veste bleu foncé en laine","Pull quart zip blanc Ralph Lauren","Jean bleu clair"]],["Veste bleue 3",["Veste bleu foncé en laine","Pull marron","Pantalon beige"]],["Veste bleue 4",["Veste bleu foncé en laine","Pull gris","Pantalon blanc"]],["Veste verte 1",["Veste verte","Pull noir","Jean gris"]],["Veste verte 2",["Veste verte","Pull blanc","Pantalon marron"]],["Veste verte 3",["Veste verte","Pull beige","Pantalon marron"]],["Veste verte 4",["Veste verte","Pull torsadé marron Ralph Lauren","Jean gris"]],["Veste verte 5",["Veste verte","Pull blanc","Jean bleu foncé"]],["Veste verte 6",["Veste verte","Pull bleu foncé Stone","Pantalon beige"]],["Veste noire 1",["Veste noire","Pull marron","Pantalon noir"]],["Veste noire 2",["Veste noire","Pull blanc","Jean gris"]],["Veste noire 3",["Veste noire","Pull vert foncé torsadé","Jean bleu clair"]],["Veste noire 4",["Veste noire","Pull quart zip noir","Pantalon beige"]],["Veste noire 5",["Veste noire","Pull gris","Jean bleu clair"]],["Veste beige 1",["Veste beige","Pull noir","Pantalon marron"]],["Veste beige 2",["Veste beige","Pull bleu foncé Stone","Pantalon noir"]],["Veste beige 3",["Veste beige","Pull noir","Jean bleu clair"]],["Veste beige 4",["Veste beige","Pull gris","Jean bleu foncé"]],["Veste cuir 1",["Veste en cuir","Pull noir","Jean gris"]],["Veste cuir 2",["Veste en cuir","Pull beige","Pantalon noir"]],["Veste cuir 3",["Veste en cuir","Pull gris","Jean bleu foncé"]],["Veste cuir 4",["Veste en cuir","Pull noir","Pantalon beige"]],["Veste cuir 5",["Veste en cuir","Pull torsadé blanc Ralph Lauren","Jean bleu clair"]]];
const defImg=u=>u.startsWith("L:")?"/"+u.slice(2):"/api/img?url="+encodeURIComponent(u.startsWith("U:")?"https://image.uniqlo.com/UQ/ST3/eu/imagesgoods/"+u.slice(2)+"?width=700":"https://cdn.shopify.com/s/files/1/0087/6193/3920/files/"+u.slice(2));
let S={clothes:[],outfits:[],me:""},tab="today",ui={occ:"",seas:"",cat:"",sel:[],cur:null};

/* ---- stockage IndexedDB ---- */
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open("garderobe",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=ko});
async function load(){const d=await idb();return new Promise(ok=>{const q=d.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>ok(q.result)})}
async function save(){const d=await idb();await new Promise(r=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(S,"state");t.oncomplete=t.onerror=t.onabort=r})}
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)};
const C=i=>S.clothes.find(c=>c.id===i);

/* ---- images ---- */
const resize=(file,max)=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(file)});
const tile=(c,x="")=>`<div class="it ${x}" data-id="${c.id}">${c.img?`<img src="${c.img}">`:`<div class="ph">${EMO[c.cat]}</div>`}<div class="lb"><span class="dot" style="background:${COL[c.color]}"></span>${c.name}</div></div>`;

/* ---- navigation ---- */
const TABS=[["today","✨","Idées"],["closet","👕","Dressing"],["outfits","🪞","Looks"],["me","👤","Moi"]];
function render(){
  $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?"on":""}" data-t="${k}"><b>${i}</b>${l}</button>`).join("");
  $("#sub").textContent=`${new Date().toLocaleDateString("fr",{weekday:"long",day:"numeric",month:"long"})} · ${S.clothes.length} pièces · ${S.outfits.length} looks`;
  m.style.animation="none";m.offsetWidth;m.style.animation="";
  ({today,closet,outfits,me})[tab]()}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};
const openSheet=h=>{sheet.innerHTML=`<div>${h}</div>`;sheet.classList.add("open")};
const closeSheet=()=>sheet.classList.remove("open");
sheet.onclick=e=>{if(e.target===sheet)closeSheet()};

/* ---- génération ---- */
const seasonOK=(c,s)=>!s||!c.seas||c.seas===s||c.seas==="Toute l'année";
const matches=(a,b)=>NEUTRAL.includes(a.color)||NEUTRAL.includes(b.color)||a.color===b.color;
function generate(){
  const ok=c=>seasonOK(c,ui.seas)&&(!ui.occ||!c.occ||c.occ===ui.occ),L=k=>S.clothes.filter(c=>c.cat===k&&ok(c));
  for(let n=0;n<80;n++){
    let it=[];
    if(L("Robe").length&&Math.random()<.3)it.push(pick(L("Robe")));
    else{const T=[...L("T-shirt"),...L("Pull & sweat"),...L("Haut")];if(!T.length||!L("Bas").length)return null;const h=pick(T),b=pick(L("Bas"));if(!matches(h,b))continue;it.push(h,b)}
    if(L("Chaussures").length){const s=pick(L("Chaussures"));if(!it.every(i=>matches(i,s)))continue;it.push(s)}
    if(L("Veste").length&&(ui.seas==="Hiver"||ui.seas==="Mi-saison"||Math.random()<.35)){const v=pick(L("Veste"));if(it.every(i=>matches(i,v)))it.push(v)}
    if(L("Accessoire").length&&Math.random()<.4)it.push(pick(L("Accessoire")));
    return it.map(i=>i.id)}
  return null}
async function renderLook(ids){
  if(!S.me)throw new Error("Ajoute d'abord ta photo dans l'onglet « Moi »");
  const g=ids.map(C).filter(c=>c&&c.img).map(c=>({cat:c.cat,name:c.name,color:c.color,img:c.img}));for(const x of g)if(!x.img.startsWith("data:"))x.img=await resize(await (await fetch(x.img)).blob(),700);
  if(!g.length)throw new Error("Ajoute des photos à tes vêtements");
  for(let t=0;t<2;t++){
    const r=await fetch("/api/tryon",{method:"POST",headers:{"Content-Type":"application/json","x-code":localStorage.getItem("code")||""},body:JSON.stringify({person:S.me,garments:g})});
    const j=await r.json();if(r.status===401&&t===0){const c=prompt("Code d'accès ?");if(!c)throw new Error(j.error);localStorage.setItem("code",c);continue}
    if(!r.ok)throw new Error(j.error);return j.image}}

/* ---- vues ---- */
function today(){
  const chips=(a,k)=>`<div class="row">${a.map(x=>`<button class="chip ${ui[k]===x?"on":""}" data-k="${k}" data-v="${x}">${x}</button>`).join("")}</div>`;
  m.innerHTML=`<h2>Qu&#39;est-ce qu&#39;on porte aujourd&#39;hui&nbsp;?</h2><div class="card"><small>Occasion</small>${chips(OCC,"occ")}<br><small>Saison</small>${chips(SEAS,"seas")}</div>
  <div class="row"><button class="btn" id="mine">🎲 Un de mes looks</button><button class="btn ghost" id="gen">✨ Nouvelle idée</button></div><div id="res"></div>`;
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ui[b.dataset.k]=ui[b.dataset.k]===b.dataset.v?"":b.dataset.v;today()});
  const show=(ids,title,o)=>{$("#res").innerHTML=`<h2>${title}</h2><div class="card"><div class="grid">${ids.map(C).filter(Boolean).map(c=>tile(c)).join("")}</div><br><div class="row"><button class="btn sm" id="try">🪄 Me voir habillé·e</button>${o?`<button class="btn sm ghost" id="sv">💾 Garder</button>`:""}</div></div><div id="out"></div>`;
    $("#try").onclick=async()=>{$("#out").innerHTML=`<div class="shim">Création du rendu…</div>`;try{const img=await renderLook(ids);$("#out").innerHTML=`<img class="render" src="${img}">`;ui.last=img}catch(e){$("#out").innerHTML="";toast(e.message)}};
    if(o)$("#sv").onclick=async()=>{const n=prompt("Nom du look ?","Look du "+new Date().toLocaleDateString("fr"));if(!n)return;S.outfits.push({id:id(),name:n,items:ids,occ:ui.occ,seas:ui.seas,render:ui.last||""});await save();toast("Look enregistré ✨");render()}};
  $("#mine").onclick=()=>{const l=S.outfits.filter(o=>(!ui.occ||!o.occ||o.occ===ui.occ)&&(!ui.seas||!o.seas||o.seas===ui.seas));if(!l.length)return toast("Aucun look pour ces filtres");const o=pick(l);ui.last=o.render;show(o.items,o.name,0);if(o.render)$("#out").innerHTML=`<img class="render" src="${o.render}">`};
  $("#gen").onclick=()=>{const g=generate();ui.last="";g?show(g,"Idée du jour",1):toast("Il faut au moins 1 haut + 1 bas (ou 1 robe)")}}

function closet(){
  const l=S.clothes.filter(c=>!ui.cat||c.cat===ui.cat);
  m.innerHTML=`<h2>Mon dressing</h2><div class="row"><button class="btn" id="add">＋ Ajouter une pièce</button></div><br>
  <div class="row">${["",...CATS].map(c=>`<button class="chip ${ui.cat===c?"on":""}" data-c="${c}">${c||"Tout"}</button>`).join("")}</div><br>
  <div class="grid">${l.map(c=>tile(c)).join("")}</div>${l.length?"":`<div class="empty">Ton dressing est vide.<br>Ajoute ta première pièce ✨</div>`}`;
  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ui.cat=b.dataset.c;closet()});
  m.querySelectorAll(".it").forEach(e=>e.onclick=()=>clothForm(C(e.dataset.id)));$("#add").onclick=()=>clothForm()}
function clothForm(c){
  const isNew=!c;c=c||{id:id(),name:"",cat:"T-shirt",color:"Noir",seas:"",occ:"",img:""};
  const opt=(a,v,e)=>(e?`<option value="">${e}</option>`:"")+a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
  openSheet(`<h2 style="margin-top:0">${isNew?"Nouvelle pièce":"Modifier"}</h2>
  <div class="drop" id="dr">${c.img?`<img src="${c.img}">`:"📷 Touche pour ajouter une photo"}<input type="file" accept="image/*" id="f"></div>
  <input id="n" placeholder="Nom (ex : Jean noir slim)" value="${c.name}">
  <select id="c">${opt(CATS,c.cat)}</select>
  <div class="row" style="margin:8px 0" id="sws">${Object.keys(COL).map(k=>`<button class="sw ${k===c.color?"on":""}" data-k="${k}" style="background:${COL[k]}" title="${k}"></button>`).join("")}</div>
  <select id="s">${opt(SEAS,c.seas,"Toute l'année")}</select><select id="o">${opt(OCC,c.occ,"Toute occasion")}</select><br>
  <div class="row"><button class="btn" id="ok">Enregistrer</button>${isNew?"":`<button class="btn ghost" id="del">Supprimer</button>`}</div>`);
  const onF=async e=>{if(!e.target.files[0])return;c.img=await resize(e.target.files[0],700);$("#dr").innerHTML=`<img src="${c.img}"><input type="file" accept="image/*" id="f">`;$("#f").onchange=onF};
  $("#f").onchange=onF;
  $("#sws").onclick=e=>{const k=e.target.dataset.k;if(!k)return;c.color=k;document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s.dataset.k===k))};
  $("#ok").onclick=async()=>{c.name=$("#n").value||c.cat;c.cat=$("#c").value;c.seas=$("#s").value;c.occ=$("#o").value;if(isNew)S.clothes.push(c);await save();closeSheet();render()};
  if(!isNew)$("#del").onclick=async()=>{if(!confirm("Supprimer ?"))return;S.clothes=S.clothes.filter(x=>x.id!==c.id);S.outfits.forEach(o=>o.items=o.items.filter(i=>i!==c.id));await save();closeSheet();render()}}

function outfits(){
  m.innerHTML=`<h2>Mes looks</h2><button class="btn" id="add">＋ Créer un look</button><br><br>`+(S.outfits.map(o=>`<div class="card">
  ${o.render?`<img class="render" src="${o.render}" style="margin-bottom:10px">`:""}<div class="row"><b>${o.name}</b><small>${[o.occ,o.seas].filter(Boolean).join(" · ")}</small></div>
  <div class="mini">${o.items.map(C).filter(Boolean).map(c=>`<div class="pc">${c.img?`<img src="${c.img}">`:`<div class="ph">${EMO[c.cat]}</div>`}<span>${c.name}</span></div>`).join("")}</div><br>
  <div class="row"><button class="btn sm" data-r="${o.id}">🪄 ${o.render?"Regénérer":"Générer le rendu"}</button><button class="btn sm ghost" data-d="${o.id}">🗑</button></div></div>`).join("")||`<div class="empty">Aucun look pour l'instant.</div>`);
  m.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer ce look ?")){S.outfits=S.outfits.filter(o=>o.id!==b.dataset.d);await save();render()}});
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const o=S.outfits.find(x=>x.id===b.dataset.r);b.disabled=true;b.textContent="⏳ Création…";try{o.render=await renderLook(o.items);await save();render()}catch(e){toast(e.message);b.disabled=false;b.textContent="🪄 Réessayer"}});
  $("#add").onclick=()=>{ui.sel=[];builder()}}
function builder(){
  openSheet(`<h2 style="margin-top:0">Nouveau look</h2><input id="n" placeholder="Nom du look"><select id="o"><option value="">Toute occasion</option>${OCC.map(x=>`<option>${x}</option>`).join("")}</select><select id="s"><option value="">Toute saison</option>${SEAS.map(x=>`<option>${x}</option>`).join("")}</select>
  ${CATS.map(k=>{const l=S.clothes.filter(c=>c.cat===k);return l.length?`<h2>${k}</h2><div class="grid">${l.map(c=>tile(c)).join("")}</div>`:""}).join("")||`<p class="mut">Ajoute d'abord des vêtements.</p>`}<br><button class="btn" id="ok">Enregistrer</button>`);
  sheet.querySelectorAll(".it").forEach(e=>e.onclick=()=>{const i=e.dataset.id;ui.sel=ui.sel.includes(i)?ui.sel.filter(x=>x!==i):[...ui.sel,i];e.classList.toggle("sel")});
  $("#ok").onclick=async()=>{if(!ui.sel.length)return toast("Choisis au moins une pièce");S.outfits.push({id:id(),name:$("#n").value||"Look "+(S.outfits.length+1),items:ui.sel,occ:$("#o").value,seas:$("#s").value,render:""});await save();closeSheet();render()}}

function me(){
  m.innerHTML=`<h2>Moi</h2><div class="card"><p class="mut">Ta photo en pied (de face, fond simple) sert de base pour générer tes looks portés.</p>
  <div class="drop">${S.me?`<img src="${S.me}">`:"📷 Ajouter ma photo"}<input type="file" accept="image/*" id="f"></div></div>
  <div class="card"><div class="row"><button class="btn ghost sm" id="ex">⬇ Exporter</button><label class="btn ghost sm">⬆ Importer<input type="file" id="im" accept=".json" hidden></label></div><p class="mut"><small>Données stockées sur cet appareil. Exporte pour sauvegarder.</small></p></div>`;
  $("#f").onchange=async e=>{if(!e.target.files[0])return;S.me=await resize(e.target.files[0],1024);await save();toast("Photo enregistrée");me()};
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="garde-robe.json";a.click()};
  $("#im").onchange=e=>{const r=new FileReader();r.onload=async()=>{try{S=JSON.parse(r.result);await save();toast("Importé ✅");render()}catch{toast("Fichier invalide")}};r.readAsText(e.target.files[0])}}

load().then(d=>{if(d)S=d;if(S.defV!==2){const have=new Set(S.clothes.map(c=>c.name));DEF.forEach(([name,cat,color,u])=>{if(!have.has(name))S.clothes.push({id:id(),name,cat,color,seas:"",occ:"",img:u?defImg(u):""})});const N=n=>(S.clothes.find(c=>c.name===n)||{}).id;const hl=new Set(S.outfits.map(o=>o.name));DEFL.forEach(([name,it])=>{if(!hl.has(name))S.outfits.push({id:id(),name,items:it.map(N).filter(Boolean),occ:"",seas:"",render:""})});S.defV=2;save()}if(S.defV<3){DEF.forEach(([n,cat,color,u])=>{const c=S.clothes.find(x=>x.name===n);if(c&&u.startsWith("L:")&&(!c.img||c.img.startsWith("/api/img")))c.img=defImg(u);if(c&&n==="Veste en cuir")c.color=color});S.defV=3;save()}if(S.defV<4){const have=new Set(S.clothes.map(c=>c.name));DEF.forEach(([n,cat,color,u])=>{let c=S.clothes.find(x=>x.name===n);if(!c&&!have.has(n)){c={id:id(),name:n,cat,color,seas:"",occ:"",img:""};S.clothes.push(c)}if(c&&u.startsWith("L:")&&(!c.img||c.img.startsWith("/api/img")))c.img=defImg(u)});S.defV=4;save()}if(S.defV<5){const g=S.clothes.find(x=>x.name==="Jean brut G-Star");if(g){S.clothes=S.clothes.filter(x=>x!==g);S.outfits.forEach(o=>o.items=o.items.filter(i=>i!==g.id))}const j=S.clothes.find(x=>x.name==="Jean bleu foncé");if(j&&(!j.img||j.img.startsWith("/api/img")||j.img==="/img/jean-bleu-fonce.jpg"))j.img="/img/jean-brut.jpg";S.defV=5;save()}let ch=0;S.clothes.forEach(c=>{if(c.cat==="Haut"){c.cat=/^(pull|sweat)/i.test(c.name)?"Pull & sweat":"T-shirt";ch=1}});if(ch)save();render()});
</script></body></html>
